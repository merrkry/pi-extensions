minimumReleaseAge: 10080 # 7 days in minutes

overrides:
  # Route Vite consumers, including Vitest, to the Vite+ core.
  "vite@*": "catalog:"

peerDependencyRules:
  # The Vite+ core follows Vite+ versions rather than Vite's.
  allowedVersions:
    vite: "*"

allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
